<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Google</title>
<meta name="robots" content="index,follow">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.5 Arial,Helvetica,sans-serif;color:#202124;background:#fff;display:flex;flex-direction:column}
.top{display:flex;justify-content:flex-end;gap:18px;padding:14px 18px;font-size:13px}
.top a{color:#202124;text-decoration:none}
.top a:hover{text-decoration:underline}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 90px}
.logo{font:700 68px/1 Arial,Helvetica,sans-serif;letter-spacing:-3px;margin-bottom:26px;user-select:none}
.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#EA4335}
.logo span:nth-child(3){color:#FBBC05}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#34A853}
.logo span:nth-child(6){color:#EA4335}
.search{width:100%;max-width:560px;display:flex;align-items:center;gap:10px;border:1px solid #dfe1e5;border-radius:24px;padding:11px 16px;box-shadow:none}
.search:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
.search input{flex:1;border:0;outline:0;font-size:16px}
.btns{display:flex;gap:12px;margin-top:26px}
.btns button{background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;color:#3c4043;font-size:14px;padding:9px 16px;cursor:pointer}
.btns button:hover{border-color:#dadce0;box-shadow:0 1px 1px rgba(0,0,0,.1)}
footer{background:#f2f2f2;color:#70757a;font-size:13px}
.frow{padding:12px 18px;border-bottom:1px solid #dadce0}
.flinks{display:flex;gap:20px;flex-wrap:wrap;padding:12px 18px}
.flinks a{color:#70757a;text-decoration:none}
svg{display:block}
@media(max-width:520px){.logo{font-size:48px}}
</style>
</head>
<body>
<div class="top"><a href="#">Почта</a><a href="#">Картинки</a><a href="#">Войти</a></div>
<div class="mid">
  <div class="logo" aria-label="Google"><span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span></div>
  <form class="search" onsubmit="return false">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input aria-label="Поиск" placeholder="Введите запрос">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4285F4" stroke-width="2"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M17 11a5 5 0 0 1-10 0"/><path d="M12 17v4"/></svg>
  </form>
  <div class="btns"><button>Поиск в Google</button><button>Мне повезёт!</button></div>
</div>
<footer>
  <div class="frow">Россия</div>
  <div class="flinks"><a href="#">О Google</a><a href="#">Реклама</a><a href="#">Для бизнеса</a><a href="#">Как работает Поиск</a><a href="#">Конфиденциальность</a><a href="#">Условия</a><a href="#">Настройки</a></div>
</footer>
</body>
</html>
